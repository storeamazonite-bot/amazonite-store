<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Product · Amazonite</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../assets/admin.css"><script src="../assets/affiliate-link-validator.js"></script></head>
<body><aside class="sidebar"><a class="brand" href="../index.html">◆ Amazonite</a><p class="label">COMMAND CENTER</p><nav><a href="index.html">Overview</a><a class="active" href="products.html">Products</a><a href="add-product.html">+ Add Affiliate</a><a href="links.html">Affiliate Links</a><a href="marketing.html">Marketing</a><a href="analytics.html">Analytics</a><a href="automation.html">Automation</a><a href="settings.html">Settings</a></nav></aside>
<main class="main"><header class="top"><div><p class="eyebrow">AFFILIATE LINK ENGINE</p><h1>Edit product</h1><p class="sub">Update the owner catalog through the protected Products API.</p></div></header>
<form id="productForm" class="form panel"><div class="form-grid">
<label>Product name<input name="name" required></label><label>Category<select name="category"><option>Audio & Tech</option><option>Smart Home</option><option>Kitchen & Everyday</option><option>Mobile Accessories</option><option>Travel & Lifestyle</option></select></label>
<label>Original product URL<input name="original_url" type="url" required></label><label>Affiliate URL<input id="affiliateUrl" name="affiliate_url" type="url" required><small id="affiliateStatus" class="field-status">Waiting for URL…</small></label>
<label>Price<input name="price" type="number" step="0.01" min="0"></label><label>Currency<select name="currency"><option>USD</option><option>GBP</option><option>CAD</option><option>EUR</option></select></label><label>Commission %<input name="commission_rate" type="number" step="0.1" min="0"></label><label>Rating<input name="rating" type="number" step="0.1" min="0" max="5"></label><label>Orders<input name="orders" type="number" min="0"></label><label>Market<select name="market"><option>US</option><option>UK</option><option>Canada</option><option>EU</option></select></label><label>Status<select name="status"><option>Draft</option><option>Testing</option><option>Active</option></select></label>
<label class="wide">Product image URL<input name="image_url" type="url"></label><label class="wide">Notes<textarea name="notes"></textarea></label></div>
<div id="result" class="notice" hidden></div><div class="form-actions"><a class="button" href="products.html">Cancel</a><button id="saveButton" class="button primary" type="submit">Save changes</button></div></form></main>
<script>
const id=new URLSearchParams(location.search).get('id'),form=document.getElementById('productForm'),result=document.getElementById('result'),affiliateUrl=document.getElementById('affiliateUrl'),affiliateStatus=document.getElementById('affiliateStatus'),saveButton=document.getElementById('saveButton');
const fields={name:'name',category:'category',original_url:'sourceProductUrl',affiliate_url:'affiliateUrl',price:'price',currency:'currency',commission_rate:'commissionRate',rating:'rating',orders:'orders',market:'market',status:'status',image_url:'imageUrl',notes:'notes'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showValidation(){const v=window.AmazoniteLinkValidator.validate(affiliateUrl.value);affiliateStatus.textContent=v.status+' · '+v.reason;affiliateStatus.dataset.status=v.status;return v;}
function setField(name,value){const el=form.elements[name];if(!el)return;el.value=value??'';}
async function load(){if(!id){result.hidden=false;result.textContent='Missing product id.';saveButton.disabled=true;return}try{const response=await fetch('../api/admin/products',{credentials:'same-origin',cache:'no-store'}),body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||('API error '+response.status));const p=(body.products||[]).find(x=>x.id===id);if(!p)throw new Error('Product not found');Object.entries(fields).forEach(([formName,property])=>{let value=p[property];if(formName==='status'&&value==='active')value='Active';if(formName==='status'&&value==='testing')value='Testing';if(formName==='status'&&value==='draft')value='Draft';setField(formName,value)});showValidation();}catch(error){result.hidden=false;result.textContent='Load failed: '+esc(error.message);saveButton.disabled=true;}}
affiliateUrl.addEventListener('input',showValidation);affiliateUrl.addEventListener('change',showValidation);
form.addEventListener('submit',async e=>{e.preventDefault();const v=showValidation();if(v.status!=='READY'){result.hidden=false;result.textContent='Cannot save: affiliate link is not READY.';return}const raw=Object.fromEntries(new FormData(form).entries()),payload={id,name:raw.name,category:raw.category,status:raw.status.toLowerCase(),sourceProductUrl:raw.original_url,affiliateUrl:raw.affiliate_url,price:raw.price===''?null:Number(raw.price),currency:raw.currency,commissionRate:raw.commission_rate===''?null:Number(raw.commission_rate),rating:raw.rating===''?null:Number(raw.rating),orders:raw.orders===''?null:Number(raw.orders),market:raw.market,imageUrl:raw.image_url||null,notes:raw.notes||'',lastCheckedAt:new Date().toISOString()};saveButton.disabled=true;try{const response=await fetch('../api/admin/products',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||('API error '+response.status));const saved=body.product||{};result.hidden=false;result.textContent='Saved ✓ '+(saved.name||payload.name)+' · Intelligence score '+Number(saved.intelligence?.score??0)+'/100';}catch(error){result.hidden=false;result.textContent='Save failed: '+esc(error.message);}finally{saveButton.disabled=false;}});load();
</script></body></html>
