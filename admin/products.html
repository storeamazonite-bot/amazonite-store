<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products · Amazonite</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../assets/admin.css"><script src="../assets/affiliate-link-validator.js"></script></head>
<body><aside class="sidebar"><a class="brand" href="../index.html">◆ Amazonite</a><p class="label">COMMAND CENTER</p><nav><a href="index.html">Overview</a><a class="active" href="products.html">Products</a><a href="add-product.html">+ Add Affiliate</a><a href="links.html">Affiliate Links</a><a href="marketing.html">Marketing</a><a href="analytics.html">Analytics</a><a href="automation.html">Automation</a><a href="settings.html">Settings</a></nav></aside>
<main class="main"><header class="top"><div><p class="eyebrow">PRODUCT INTELLIGENCE</p><h1>Product catalog</h1><p class="sub">Quality + affiliate readiness + observed performance.</p></div><a class="button primary" href="add-product.html">+ Add product</a></header>
<section class="panel"><div class="panel-head"><div><p class="eyebrow">CURRENT</p><h2>Launch catalog</h2></div><span id="count" class="tag green">Loading…</span></div><div id="summary" class="rows"></div><div id="rows" class="rows"></div></section></main>
<script>
const rows=document.getElementById('rows'),count=document.getElementById('count'),summary=document.getElementById('summary');let products=[],events=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function perf(id){const v=events.filter(e=>e.type==='product_view'&&e.product_id===id).length,c=events.filter(e=>e.type==='affiliate_click'&&e.product_id===id).length;return{views:v,clicks:c,ctr:v?c/v*100:0};}
function linkState(p){const raw=p.affiliateUrl||'';if(!raw)return{state:'NEEDS LINK',reason:'No affiliate URL'};if(window.AmazoniteLinkValidator){const r=window.AmazoniteLinkValidator.validate(raw);return{state:r.status,reason:r.reason||''}}return{state:'REVIEW',reason:'Validator unavailable'};}
function decision(p){const q=perf(p.id),l=linkState(p),s=Number(p.intelligence?.score??0),hard=p.intelligence?.hardGates||{};if(l.state!=='READY')return{label:'BLOCKED',cls:'',reason:'Affiliate link must be READY'};if(!hard.orders||!hard.rating||!hard.commission)return{label:'BLOCKED',cls:'',reason:'Product Intelligence gates not satisfied'};if(q.views<30||q.clicks<3)return{label:'COLLECT DATA',cls:'amber',reason:q.views+' views · '+q.clicks+' clicks'};if(q.ctr>=8)return{label:'WINNER',cls:'green',reason:q.ctr.toFixed(1)+'% CTR'};if(q.ctr>=5)return{label:'PROMOTE',cls:'green',reason:q.ctr.toFixed(1)+'% CTR'};if(q.ctr<1)return{label:'DROP',cls:'',reason:q.ctr.toFixed(1)+'% CTR'};return{label:s>=60?'TEST':'REVIEW',cls:'amber',reason:q.ctr.toFixed(1)+'% CTR'};}
async function load(){try{const [pr,ar]=await Promise.all([fetch('../api/admin/products',{credentials:'same-origin',cache:'no-store'}),fetch('../api/admin/analytics',{credentials:'same-origin',cache:'no-store'})]);const pb=await pr.json().catch(()=>({})),ab=await ar.json().catch(()=>({}));if(!pr.ok)throw new Error(pb.error||('Catalog API error '+pr.status));if(!ar.ok)throw new Error(ab.error||('Analytics API error '+ar.status));products=Array.isArray(pb.products)?pb.products:[];events=Array.isArray(ab.events)?ab.events:[];render()}catch(error){count.textContent='Unavailable';summary.innerHTML='<div><b>Catalog unavailable</b><span class="tag amber">API</span><em>'+esc(error.message)+'</em></div>';rows.innerHTML='';}}
function render(){count.textContent=products.length+' product'+(products.length===1?'':'s');const ready=products.filter(p=>linkState(p).state==='READY').length,winners=products.filter(p=>decision(p).label==='WINNER').length;summary.innerHTML='<div><b>Launch readiness</b><span class="tag green">'+ready+'/'+products.length+' links READY</span><em>'+winners+' performance Winner · shared analytics connected</em></div>';if(!products.length){rows.innerHTML='<div><b>No catalog products</b><span class="tag amber">Empty</span><em>Add a product from the owner workspace.</em></div>';return}rows.innerHTML=products.map(p=>{const s=Number(p.intelligence?.score??0),l=linkState(p),q=perf(p.id),d=decision(p),quality=s>=80?'High Potential':s>=60?'Test':'Watch';return '<div><b>'+esc(p.name)+'</b><span class="tag '+(s>=80?'green':s>=60?'amber':'')+'">'+quality+' · '+s+'/100</span><span class="tag '+(l.state==='READY'?'green':l.state==='REVIEW'?'amber':'')+'">Link · '+esc(l.state)+'</span><span class="tag '+d.cls+'">'+d.label+'</span><em>'+esc(p.category||'Uncategorized')+' · '+esc(p.market||'')+' · '+q.views+' views · '+q.clicks+' clicks · '+q.ctr.toFixed(1)+'% CTR · '+esc(d.reason)+'</em></div>'}).join('')}
load();
</script></body></html>
