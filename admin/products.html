<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products · Amazonite</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../assets/admin.css"><script src="../assets/affiliate-link-validator.js"></script></head>
<body><aside class="sidebar"><a class="brand" href="../index.html">◆ Amazonite</a><p class="label">COMMAND CENTER</p><nav><a href="index.html">Overview</a><a class="active" href="products.html">Products</a><a href="add-product.html">+ Add Affiliate</a><a href="links.html">Affiliate Links</a><a href="marketing.html">Marketing</a><a href="analytics.html">Analytics</a><a href="automation.html">Automation</a><a href="settings.html">Settings</a></nav></aside>
<main class="main"><header class="top"><div><p class="eyebrow">PRODUCT INTELLIGENCE</p><h1>Product catalog</h1><p class="sub">Quality + affiliate readiness + observed performance.</p></div><a class="button primary" href="add-product.html">+ Add product</a></header>
<section class="panel"><div class="panel-head"><div><p class="eyebrow">CURRENT</p><h2>Launch catalog</h2></div><span id="count" class="tag green">0 products</span></div><div id="summary" class="rows"></div><div id="rows" class="rows"></div></section></main>
<script>
const KEY='amazonite_products_v1',EVENTS='amazonite_events_v1',rows=document.getElementById('rows'),count=document.getElementById('count'),summary=document.getElementById('summary');
let products=[],events=[];try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){}try{events=JSON.parse(localStorage.getItem(EVENTS)||'[]')}catch(_){}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function perf(id){const e=events.filter(x=>String(x.product_id||'')===String(id));const views=e.filter(x=>x.type==='product_view').length;const clicks=e.filter(x=>x.type==='affiliate_click').length;const ctr=views?clicks/views*100:0;return{views,clicks,ctr};}
function linkState(p){const raw=p.affiliate_url||'';if(!raw)return{state:'NEEDS LINK',reason:'No affiliate URL'};if(window.AmazoniteLinkValidator){const r=window.AmazoniteLinkValidator.validate(raw);return{state:r.status,reason:r.reason||''}}return{state:p.link_status||'REVIEW',reason:p.link_validation_reason||'Validator unavailable'};}
function decision(p){const q=perf(p.id),l=linkState(p),s=Number(p.score||0);if(l.state!=='READY')return{label:'BLOCKED',cls:'',reason:'Affiliate link must be READY'};if(q.views<30||q.clicks<3)return{label:'COLLECT DATA',cls:'amber',reason:q.views+' views · '+q.clicks+' clicks'};if(q.ctr>=8)return{label:'WINNER',cls:'green',reason:q.ctr.toFixed(1)+'% CTR'};if(q.ctr>=5)return{label:'PROMOTE',cls:'green',reason:q.ctr.toFixed(1)+'% CTR'};if(q.ctr<1)return{label:'DROP',cls:'',reason:q.ctr.toFixed(1)+'% CTR'};return{label:s>=75?'TEST':'REVIEW',cls:'amber',reason:q.ctr.toFixed(1)+'% CTR'};}
count.textContent=products.length+' product'+(products.length===1?'':'s');
const ready=products.filter(p=>linkState(p).state==='READY').length,winners=products.filter(p=>decision(p).label==='WINNER').length;
summary.innerHTML='<div><b>Launch readiness</b><span class="tag green">'+ready+'/'+products.length+' links READY</span><em>'+winners+' performance Winner'+(winners===1?'':'s')+' · analytics requires minimum 30 views + 3 clicks</em></div>';
if(!products.length){rows.innerHTML='<div><b>No local drafts yet</b><span class="tag amber">Ready</span><em>Use Add Affiliate to create the first product draft.</em></div>'}
else{rows.innerHTML=products.map(p=>{const s=Number(p.score||0),l=linkState(p),q=perf(p.id),d=decision(p);const quality=s>=90?'Winner':s>=75?'Strong Test':s>=60?'Test':'Review';return '<div><b>'+esc(p.name)+'</b><span class="tag '+(s>=75?'green':s>=60?'amber':'')+'">'+quality+' · '+s+'/100</span><span class="tag '+(l.state==='READY'?'green':l.state==='REVIEW'?'amber':'')+'">Link · '+esc(l.state)+'</span><span class="tag '+d.cls+'">'+d.label+'</span><em>'+esc(p.category||'Uncategorized')+' · '+esc(p.market||'')+' · '+q.views+' views · '+q.clicks+' clicks · '+q.ctr.toFixed(1)+'% CTR · '+esc(d.reason)+'</em></div>'}).join('')}
</script></body></html>
