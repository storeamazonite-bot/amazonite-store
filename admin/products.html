<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products · Amazonite</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../assets/admin.css"></head>
<body><aside class="sidebar"><a class="brand" href="../index.html">◆ Amazonite</a><p class="label">COMMAND CENTER</p><nav><a href="index.html">Overview</a><a class="active" href="products.html">Products</a><a href="add-product.html">+ Add Affiliate</a><a href="links.html">Affiliate Links</a><a href="marketing.html">Marketing</a><a href="analytics.html">Analytics</a><a href="automation.html">Automation</a><a href="settings.html">Settings</a></nav></aside>
<main class="main"><header class="top"><div><p class="eyebrow">PRODUCT INTELLIGENCE</p><h1>Product catalog</h1><p class="sub">The operating list for verified, testing and winning products.</p></div><a class="button primary" href="add-product.html">+ Add product</a></header>
<section class="panel"><div class="panel-head"><div><p class="eyebrow">CURRENT</p><h2>Launch catalog</h2></div><span id="count" class="tag green">0 products</span></div><div id="rows" class="rows"></div></section></main>
<script>
const KEY='amazonite_products_v1', rows=document.getElementById('rows'), count=document.getElementById('count');
let products=[];try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){}
count.textContent=products.length+' product'+(products.length===1?'':'s');
if(!products.length){rows.innerHTML='<div><b>No local drafts yet</b><span class="tag amber">Ready</span><em>Use Add Affiliate to create the first product draft.</em></div>'}
else{rows.innerHTML=products.map(p=>{const s=Number(p.score||0);const cls=s>=75?'green':s>=60?'amber':'';const state=s>=90?'Winner':s>=75?'Strong Test':s>=60?'Test':'Review';return '<div><b>'+esc(p.name)+'</b><span class="tag '+cls+'">'+state+' · '+s+'/100</span><em>'+esc(p.category||'Uncategorized')+' · '+esc(p.market||'')+' · '+esc(p.status||'Draft')+'</em></div>'}).join('')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
