<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Amazonite Electronic — Owner Login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:420px;margin:12vh auto;padding:24px;background:#f7f7f7;color:#171717}
    main{background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001} h1{font-size:22px;margin-top:0}
    label{display:block;margin:18px 0 7px;font-weight:600} input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit}
    button{margin-top:18px;cursor:pointer;font-weight:700} #status{min-height:1.4em;margin-top:14px}
  </style>
</head>
<body>
<main>
  <h1>Owner access</h1>
  <p>This area is restricted to the store owner.</p>
  <form id="login" autocomplete="off">
    <label for="password">Owner password</label>
    <input id="password" name="password" type="password" required maxlength="256" autocomplete="current-password">
    <button type="submit">Sign in</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
const form=document.getElementById('login');
const status=document.getElementById('status');
const next=new URLSearchParams(location.search).get('next');
form.addEventListener('submit',async event=>{
  event.preventDefault(); status.textContent='Signing in…';
  try{
    const response=await fetch('/api/auth/login.mjs',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:form.password.value})});
    if(!response.ok){status.textContent='Access denied.'; form.password.value=''; return;}
    location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/dashboard/');
  }catch{status.textContent='Authentication service unavailable.';}
});
</script>
</body>
</html>
