<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Amazonite Electronic — Owner Login</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#111b2d;--line:#263650;--text:#f8fafc;--muted:#94a3b8;--orange:#ff8c1a;--blue:#2e6bff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#17243d 0,#0b1220 48%,#070c15 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    .card{width:min(430px,100%);background:rgba(17,27,45,.96);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange),var(--blue));font-size:24px;font-weight:900;margin-bottom:20px}
    h1{font-size:25px;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 24px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:#dbe4f0}input{width:100%;border:1px solid var(--line);background:#0b1322;color:var(--text);border-radius:12px;padding:13px 14px;font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,107,255,.16)}button{width:100%;margin-top:8px;border:0;border-radius:12px;padding:14px 16px;background:linear-gradient(90deg,var(--orange),#ff9f43);color:#111827;font-weight:900;font-size:15px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:20px;margin-top:14px;color:#ffb4b4;font-size:13px}.foot{margin-top:20px;font-size:12px;color:#64748b;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">◆</div>
    <h1>Owner access</h1>
    <p>Amazonite Electronic private management area. Your password and authenticator code are verified server-side.</p>
    <form id="loginForm" autocomplete="off" novalidate>
      <div class="field"><label for="password">Owner password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="totp">Authenticator code</label><input id="totp" name="totp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></div>
      <button id="submit" type="submit">Sign in securely</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <div class="foot">Private owner area · No credentials are stored in this browser.</div>
  </main>
  <script>
    const form=document.getElementById('loginForm');
    const button=document.getElementById('submit');
    const error=document.getElementById('error');
    form.addEventListener('submit',async(event)=>{
      event.preventDefault(); error.textContent=''; button.disabled=true;
      const password=document.getElementById('password').value;
      const totp=document.getElementById('totp').value.trim();
      if(!password||!/^[0-9]{6}$/.test(totp)){error.textContent='Enter the owner password and 6-digit authenticator code.';button.disabled=false;return;}
      try{
        const response=await fetch('/api/owner-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password,totp})});
        const data=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(data.error||'Owner authentication failed');
        window.location.replace('/dashboard/');
      }catch(e){error.textContent='Unable to authenticate. Check your credentials and try again.';button.disabled=false;}
    });
  </script>
</body>
</html>
