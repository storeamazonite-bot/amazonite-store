name: Amazonite AI Integration

on:
  push:
    paths:
      - 'docs/ai-team/**'
      - 'scripts/ai-team/**'
      - '.github/workflows/amazonite-ai-integration.yml'
  pull_request:
    paths:
      - 'docs/ai-team/**'
      - 'scripts/ai-team/**'
      - '.github/workflows/amazonite-ai-integration.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Amazonite AI Team Health'
    types:
      - completed

permissions:
  contents: read

jobs:
  integration:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run end-to-end AI team integration checks
        run: node scripts/ai-team/integration-e2e.test.js
