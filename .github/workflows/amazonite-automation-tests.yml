name: Amazonite Automation Tests

on:
  push:
    paths:
      - 'automation/**'
      - 'data/products.json'
      - '.github/workflows/amazonite-automation-tests.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'automation/**'
      - 'data/products.json'
      - '.github/workflows/amazonite-automation-tests.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Product Intelligence tests
        run: node automation/product-intelligence-test.mjs
      - name: Run Affiliate Readiness tests
        run: node automation/affiliate-readiness-test.mjs
      - name: Run AliExpress adapter tests
        run: node automation/aliexpress-mcp-test.mjs
      - name: Run AliExpress API contract test
        run: node automation/aliexpress-api-contract-test.mjs
