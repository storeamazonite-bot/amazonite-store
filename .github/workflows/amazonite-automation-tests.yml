name: Amazonite Automation Tests

on:
  push:
    paths:
      - 'automation/**'
      - 'api/**'
      - 'lib/**'
      - 'supabase/**'
      - 'data/products.json'
      - 'index.html'
      - '.github/workflows/amazonite-automation-tests.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'automation/**'
      - 'api/**'
      - 'lib/**'
      - 'supabase/**'
      - 'data/products.json'
      - 'index.html'
      - '.github/workflows/amazonite-automation-tests.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore approved original-preserved storefront
        run: |
          set -euo pipefail
          if [ -f automation/restore-index.gz.b64 ]; then
            base64 -d automation/restore-index.gz.b64 | gzip -d > index.html
            sha256sum index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: restore approved original storefront integration" || true
            git rm -f automation/restore-index.gz.b64 .github/workflows/restore-approved-index.yml || true
            git commit -m "chore: remove one-time restore assets" || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Run Original baseline integrity test
        run: node automation/original-baseline-integrity-test.mjs
      - name: Run Owner Auth security contract test
        run: node automation/owner-auth-security-test.mjs
      - name: Run HTTP security contract test
        run: node automation/http-security-contract-test.mjs
      - name: Run Dashboard integration contract test
        run: node automation/dashboard-integration-test.mjs
      - name: Run Product Intelligence tests
        run: node automation/product-intelligence-test.mjs
      - name: Run Affiliate Readiness tests
        run: node automation/affiliate-readiness-test.mjs
      - name: Run AliExpress adapter tests
        run: node automation/aliexpress-mcp-test.mjs
      - name: Run AliExpress API contract test
        run: node automation/aliexpress-api-contract-test.mjs
