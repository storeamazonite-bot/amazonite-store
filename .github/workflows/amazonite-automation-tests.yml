name: Amazonite Automation Tests

on:
  push:
    paths:
      - 'automation/**'
      - 'admin/**'
      - 'assets/**'
      - 'index.html'
      - 'owner-login.html'
      - 'vercel.json'
      - 'data/products.json'
      - 'lib/**'
      - 'middleware.js'
      - '.github/workflows/amazonite-automation-tests.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'automation/**'
      - 'admin/**'
      - 'assets/**'
      - 'index.html'
      - 'owner-login.html'
      - 'vercel.json'
      - 'data/products.json'
      - 'lib/**'
      - 'middleware.js'
      - '.github/workflows/amazonite-automation-tests.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Product Intelligence tests
        run: node automation/product-intelligence-test.mjs
      - name: Run Affiliate Readiness tests
        run: node automation/affiliate-readiness-test.mjs
      - name: Run AliExpress adapter tests
        run: node automation/aliexpress-mcp-test.mjs
      - name: Run AliExpress API contract test
        run: node automation/aliexpress-api-contract-test.mjs
      - name: Run TOTP security tests
        run: node automation/totp-test.mjs
      - name: Run Owner authentication security tests
        run: node automation/owner-auth-test.mjs
      - name: Run Owner route guard security tests
        run: node automation/owner-route-guard-test.mjs
      - name: Run legacy template regression test
        run: node automation/legacy-template-regression-test.mjs
