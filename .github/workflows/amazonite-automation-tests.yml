name: Amazonite Automation Tests

on:
  push:
    paths:
      - 'automation/**'
      - 'api/**'
      - 'lib/**'
      - 'supabase/**'
      - 'data/products.json'
      - 'index.html'
      - '.github/workflows/amazonite-automation-tests.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'automation/**'
      - 'api/**'
      - 'lib/**'
      - 'supabase/**'
      - 'data/products.json'
      - 'index.html'
      - '.github/workflows/amazonite-automation-tests.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/supabase-owner-auth
          fetch-depth: 0
      - name: Restore exact latest HTML baseline once
        if: ${{ hashFiles('automation/_secure_index_payload/*.b64') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat automation/_secure_index_payload/part1.b64 automation/_secure_index_payload/part2.b64 automation/_secure_index_payload/part3.b64 automation/_secure_index_payload/part4.b64 > /tmp/index.gz.b64
          base64 -d /tmp/index.gz.b64 > /tmp/index.html.gz
          gunzip -c /tmp/index.html.gz > index.html
          test "$(sha256sum index.html | cut -d' ' -f1)" = "e45f6e0ac3e3d51e6057f54bc45882dd97220e62ab08e8610b1156487cb858ea"
          rm -rf automation/_secure_index_payload .github/workflows/restore-latest-html-once.yml
          sed -i 's/contents: write/contents: read/' .github/workflows/amazonite-automation-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html automation/_secure_index_payload .github/workflows/restore-latest-html-once.yml .github/workflows/amazonite-automation-tests.yml
          git commit -m "fix: restore exact latest HTML secure baseline"
          git push origin HEAD:security/supabase-owner-auth
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Original baseline integrity test
        run: node automation/original-baseline-integrity-test.mjs
      - name: Run Owner Auth security contract test
        run: node automation/owner-auth-security-test.mjs
      - name: Run HTTP security contract test
        run: node automation/http-security-contract-test.mjs
      - name: Run Dashboard integration contract test
        run: node automation/dashboard-integration-test.mjs
      - name: Run Product Intelligence tests
        run: node automation/product-intelligence-test.mjs
      - name: Run Affiliate Readiness tests
        run: node automation/affiliate-readiness-test.mjs
      - name: Run AliExpress adapter tests
        run: node automation/aliexpress-mcp-test.mjs
      - name: Run AliExpress API contract test
        run: node automation/aliexpress-api-contract-test.mjs
