name: Amazonite AI Team Verification

on:
  push:
    paths:
      - 'docs/ai-team/**'
      - 'scripts/ai-team/**'
      - '.github/workflows/amazonite-ai-verify.yml'
  pull_request:
    paths:
      - 'docs/ai-team/**'
      - 'scripts/ai-team/**'
      - '.github/workflows/amazonite-ai-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify AI Team contracts
        run: node scripts/ai-team/verify.js
