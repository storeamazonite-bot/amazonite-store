name: One-time dashboard logout patch

on:
  push:
    branches:
      - security/supabase-owner-auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Apply exact dashboard-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="admin-head"><div><div class="eyebrow">OWNER AREA</div><h2>Amazonite Electronic — Dashboard</h2></div><button class="admin-close" id="adminClose">إغلاق</button></div>'
          new = '<div class="admin-head"><div><div class="eyebrow">OWNER AREA</div><h2>Amazonite Electronic — Dashboard</h2></div><div class="admin-actions"><button class="admin-close" id="adminLogout" type="button">تسجيل الخروج</button><button class="admin-close" id="adminClose" type="button">إغلاق</button></div></div>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one original dashboard header, found {s.count(old)}')
          if 'id="adminLogout"' in s:
              raise SystemExit('adminLogout already exists; refusing duplicate patch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-time-dashboard-logout-patch.yml
          git commit -m "fix: add owner dashboard logout control"
          git push