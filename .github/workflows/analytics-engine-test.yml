name: Amazonite Analytics Engine Tests

on:
  push:
    paths:
      - 'assets/analytics-engine.js'
      - 'automation/analytics-engine-test.mjs'
      - '.github/workflows/analytics-engine-test.yml'
  pull_request:
    paths:
      - 'assets/analytics-engine.js'
      - 'automation/analytics-engine-test.mjs'
      - '.github/workflows/analytics-engine-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Analytics Engine tests
        run: node --test automation/analytics-engine-test.mjs
