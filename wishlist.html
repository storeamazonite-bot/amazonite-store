<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist — Amazonite Electronic</title><meta name="description" content="Your saved electronics and smart gadget picks on Amazonite Electronic."><style>:root{--bg:#06111d;--panel:#0b1b2a;--text:#f7fbff;--muted:#9fb1c2;--orange:#ff8c1a;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans",sans-serif}.wrap{width:min(1240px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--line);background:#071521;padding:18px 0}.brand{font-size:19px;font-weight:900}.brand b{color:var(--orange)}a{text-decoration:none;color:inherit}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.back{border:1px solid #29445d;border-radius:8px;padding:10px 14px;font-size:11px;font-weight:900}.page{padding:42px 0 70px;min-height:70vh}.page h1{margin:0 0 7px;font-size:30px}.sub{color:var(--muted);font-size:11px;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(160deg,#102438,#091725);border:1px solid var(--line);border-radius:13px;overflow:hidden}.photo{height:210px;background:#e5ebf1;position:relative;display:grid;place-items:center}.photo img{width:88%;height:88%;object-fit:contain}.body{padding:13px}.cat{color:#73a9ff;font-size:9px;font-weight:900}.name{font-size:13px;line-height:1.4;margin:6px 0 8px}.price{font-size:17px;font-weight:900}.meta{color:#94a8bb;font-size:9px;margin-top:6px}.buy{display:block;text-align:center;margin-top:11px;background:var(--orange);color:#07111d;border-radius:7px;padding:10px;font-size:10px;font-weight:900}.remove{display:block;width:100%;margin-top:7px;background:transparent;border:1px solid #29445d;color:#b9c9d8;border-radius:7px;padding:8px;font-size:9px;font-weight:900;cursor:pointer}.empty{padding:35px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--muted);font-size:12px}.empty a{display:inline-block;margin-top:15px;padding:11px 16px;background:var(--orange);color:#07111d;border-radius:8px;font-weight:900;font-size:10px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{width:calc(100% - 22px)}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.photo{height:145px}.body{padding:9px}.name{font-size:10px}.price{font-size:14px}}</style></head><body><header><div class="wrap head"><a class="brand" href="index.html">Amazonite <b>Electronic</b></a><a class="back" href="index.html#products">← Continue shopping</a></div></header><main class="page"><div class="wrap"><h1>❤️ Your Wishlist</h1><p class="sub">Saved products stay on this device until you remove them.</p><div id="grid" class="grid"></div></div></main><script src="assets/wishlist.js"></script><script>(function(){const grid=document.getElementById('grid');function render(){let a=window.AmazoniteWishlist?window.AmazoniteWishlist.get():[];if(!a.length){grid.innerHTML='<div class="empty">Your wishlist is empty.<br><a href="index.html#products">Discover electronics →</a></div>';return}grid.innerHTML=a.map((x,i)=>'<article class="card"><div class="photo"><img src="'+esc(x.img)+'" alt="'+esc(x.name)+'" loading="lazy"></div><div class="body"><div class="cat">'+esc(x.cat||'Electronics')+'</div><div class="name">'+esc(x.name)+'</div><div class="price">'+esc(x.price||'')+'</div><div class="meta">'+esc(x.rating||'')+'</div>'+(x.link?'<a class="buy" href="'+esc(x.link)+'" target="_blank" rel="nofollow sponsored noopener">View on AliExpress →</a>':'<span class="buy" style="background:#1a2c3d;color:#71869a">Affiliate link pending</span>')+'<button class="remove" data-i="'+i+'">Remove from wishlist</button></div></article>').join('');grid.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{a.splice(Number(b.dataset.i),1);localStorage.setItem('amazonite_wishlist_v1',JSON.stringify(a));render()})}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render()})();</script></body></html>
