<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Amazonite Store - Discover useful products, smart finds and great deals.">
  <title>Amazonite Store</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      line-height: 1.6;
      text-align: center;
    }

    header {
      background: #111827;
      color: white;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      font-size: 20px;
      margin: 10px 0 0;
    }

    main {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 45px 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      font-size: 32px;
      color: #1f2937;
    }

    .welcome p {
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 30px;
      background: #0ea5e9;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
    }

    .button:hover {
      background: #0284c7;
    }

    footer {
      margin-top: 60px;
      padding: 25px;
      background: #111827;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Amazonite Store</h1>
    <p>Discover useful products and great deals.</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to Amazonite Store</h2>

      <p>
        Discover carefully selected products, useful finds and great deals.
        Our AI-powered affiliate marketing project is coming soon.
      </p>

      <a href="#products" class="button">Explore Products</a>
    </section>
  </main>

  <footer>
    <p>© 2026 Amazonite Store</p>
  </footer>

</body>
</html>
