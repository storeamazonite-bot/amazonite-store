<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazonite Store — Product Health</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:'#0A1E2E',teal:'#2A9D8F',orange:'#FF7A2F',bg:'#E6F0FA'}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="min-h-screen bg-bg text-slate-800">
<header class="bg-navy text-white sticky top-0 z-20 shadow-lg"><div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between"><a href="../index.html" class="font-black text-xl"><span class="text-amber-300">◆</span> Amazonite Store</a><span class="text-sm text-slate-300">Product Health Monitor</span></div></header>
<main class="max-w-7xl mx-auto p-4 md:p-8">
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6"><div><p class="text-teal font-black text-xs uppercase tracking-widest">Operations</p><h1 class="text-3xl font-black">Affiliate Link Health</h1><p class="text-slate-500 mt-1">Monitor product-level links before they reach customers.</p></div><button id="refresh" class="bg-orange text-white px-5 py-3 rounded-xl font-black hover:brightness-110 transition"><i class="fa-solid fa-rotate mr-2"></i>Refresh report</button></div>
<section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6"><div class="bg-white rounded-2xl p-5 shadow-sm border-l-4 border-teal"><p class="text-xs text-slate-500">Products checked</p><strong id="total" class="text-3xl">0</strong></div><div class="bg-white rounded-2xl p-5 shadow-sm border-l-4 border-emerald-500"><p class="text-xs text-slate-500">Reachable</p><strong id="reachable" class="text-3xl">0</strong></div><div class="bg-white rounded-2xl p-5 shadow-sm border-l-4 border-amber-500"><p class="text-xs text-slate-500">Needs review</p><strong id="review" class="text-3xl">0</strong></div><div class="bg-white rounded-2xl p-5 shadow-sm border-l-4 border-rose-500"><p class="text-xs text-slate-500">Invalid / failed</p><strong id="failed" class="text-3xl">0</strong></div></section>
<section class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="p-5 border-b flex items-center justify-between"><h2 class="font-black">Product status</h2><span id="updated" class="text-xs text-slate-400">No report loaded</span></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-left"><tr><th class="p-4">Product</th><th class="p-4">Current</th><th class="p-4">Recommended</th><th class="p-4">Affiliate URL</th><th class="p-4">HTTP</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div id="notice" class="hidden mt-4 p-4 rounded-xl bg-amber-50 text-amber-800 text-sm"></div>
</main>
<script>
const badge=s=>{const map={reachable:['Reachable','bg-emerald-100 text-emerald-700'],missing:['Needs review','bg-amber-100 text-amber-700'],http_error:['HTTP error','bg-rose-100 text-rose-700'],network_error:['Network error','bg-rose-100 text-rose-700'],timeout:['Timeout','bg-rose-100 text-rose-700']};const [t,c]=map[s]||[s,'bg-slate-100 text-slate-600'];return `<span class="px-2 py-1 rounded-full text-xs font-bold ${c}">${t}</span>`};
async function load(){const notice=document.getElementById('notice');notice.classList.add('hidden');try{const r=await fetch('../data/health/latest.json',{cache:'no-store'});if(!r.ok)throw new Error('Health report not found');const d=await r.json();const items=d.results||[];document.getElementById('total').textContent=items.length;document.getElementById('reachable').textContent=items.filter(x=>x.affiliate.state==='reachable').length;document.getElementById('review').textContent=items.filter(x=>x.recommendedStatus==='needs_review').length;document.getElementById('failed').textContent=items.filter(x=>['link_invalid','http_error','network_error','timeout'].includes(x.recommendedStatus)||['http_error','network_error','timeout'].includes(x.affiliate.state)).length;document.getElementById('updated').textContent=d.generatedAt?new Date(d.generatedAt).toLocaleString():'Loaded';document.getElementById('rows').innerHTML=items.map(x=>`<tr class="border-t"><td class="p-4 font-bold">${x.name||x.id}</td><td class="p-4">${badge(x.currentStatus)}</td><td class="p-4">${badge(x.affiliate.state)}</td><td class="p-4 max-w-xs truncate">${x.affiliate.finalUrl||'—'}</td><td class="p-4">${x.affiliate.httpStatus||'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="p-8 text-center text-slate-400">No products registered yet.</td></tr>'}catch(e){notice.textContent='The health report is not available yet. Run the link checker first; the dashboard is intentionally read-only and will not invent product status.';notice.classList.remove('hidden')}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
